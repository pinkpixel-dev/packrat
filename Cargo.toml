[package]
name = "packrat"
version = "1.0.0"
edition = "2024"
description = "Browse, update and remove everything installed on your Arch system, built with GPUI Kit"
license = "Apache-2.0"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
repository = "https://github.com/pinkpixel-dev/packrat"
publish = false

[dependencies]
alacritty_terminal = "0.26"
futures = "0.3"
gpui-kit = "0.7.1"
serde_json = "1"

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }
